name: WordPress and WooCommerce checkout integration
on:
  pull_request:
    paths:
      - 'wp-content/**/*.php'
      - 'wp-content/plugins/timonconfigs-core/resources/legal/*.html'
      - 'wp-content/themes/timonconfigs/assets/css/checkout-premium.css'
      - 'wp-content/themes/timonconfigs/assets/css/woocommerce.css'
      - 'tests/downloads-integration.php'
      - 'tests/member-catalog-integration.php'
      - 'tests/catalog-integration.php'
      - 'tests/owner-editor-integration.php'
      - 'tests/discord-integration.php'
      - 'tests/discord-checkout-return-integration.php'
      - 'tests/private-files-integration.php'
      - 'tests/text-upload-integration.php'
      - 'tests/owner-verification-integration.php'
      - 'tests/shared-vip-integration.php'
      - 'tests/catalog-routes-integration.php'
      - 'tests/woo-checkout-presentation-integration.php'
      - 'tests/woo-sync-lock-integration.php'
      - 'tests/seo-integration.php'
      - 'tests/setup-woo-test-translations.php'
      - 'tests/checkout-integration.php'
      - 'tests/site-checkout-copy-integration.php'
      - 'tests/legal-publication-integration.php'
      - 'tests/member-ui-integration.php'
      - 'tests/verify-project.sh'
      - 'tools/setup-local-wordpress.sh'
      - '.github/workflows/wordpress-download-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Native TC_Billing_* payment classes were retired in Core 1.1.3.
      # Their tests remain in Git history/source for the matching old release;
      # this job exercises WooCommerce, the active checkout, CMS and file access.
      - name: Provision disposable WordPress and private storage
        shell: bash
        run: |
          set -euo pipefail
          bash tools/setup-local-wordpress.sh > /tmp/timonconfigs-local-setup.log 2>&1 || { tail -100 /tmp/timonconfigs-local-setup.log; exit 1; }
      - name: Install pinned WooCommerce and Polish translation test coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/woocommerce/woocommerce/releases/download/10.3.5/woocommerce.zip \
            --output /tmp/woocommerce.10.3.5.zip
          printf '%s  %s\n' 8f720a1a614ef9ba7e6f71766a9f3ef972f01afa0312dfcd6259613c0db495cf /tmp/woocommerce.10.3.5.zip | sha256sum --check --status
          chmod 644 /tmp/woocommerce.10.3.5.zip
          docker compose -f docker-compose.local.yml run --rm -T -v /tmp/woocommerce.10.3.5.zip:/packages/woocommerce.zip:ro cli wp --exec='define("WP_HTTP_BLOCK_EXTERNAL", true);' plugin install /packages/woocommerce.zip --activate
          docker compose -f docker-compose.local.yml run --rm -T cli wp eval 'WC_Install::create_pages();'
          core_polish=0
          woo_polish=0
          if docker compose -f docker-compose.local.yml run --rm -T cli wp language core install pl_PL > /tmp/tc-core-polish.log 2>&1; then core_polish=1; fi
          if docker compose -f docker-compose.local.yml run --rm -T cli wp language plugin install woocommerce pl_PL > /tmp/tc-woo-polish.log 2>&1; then woo_polish=1; fi
          if (( ! core_polish || ! woo_polish )); then
            echo 'Official language packs unavailable; preparing explicitly synthetic localhost-only Polish gettext fixtures.'
            docker compose -f docker-compose.local.yml run --rm -T -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/setup-woo-test-translations.php
          fi
      - name: English checkout fields and WooCommerce AJAX validation
        run: docker compose -f docker-compose.local.yml run --rm -T -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/woo-checkout-presentation-integration.php
      - name: Provider-aware SEO metadata and indexing safeguards
        run: docker compose -f docker-compose.local.yml run --rm -T -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/seo-integration.php
      - name: Atomic per-member synchronization lease
        run: docker compose -f docker-compose.local.yml run --rm -T -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/woo-sync-lock-integration.php
      - name: Catalog visibility and filters
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/catalog-integration.php
      - name: Website-only checkout and preserved historical URL options
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/checkout-integration.php
      - name: Retired checkout stock copy migration and authored content safety
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/site-checkout-copy-integration.php
      - name: Member account and approved Owner UI
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.local.yml run --rm -T -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/member-ui-integration.php > /tmp/tc-member-ui-render.log 2>&1 || { tail -c 3000 /tmp/tc-member-ui-render.log; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(next(line for line in Path('/tmp/tc-member-ui-render.log').read_text().splitlines() if line.startswith('{')))
          assert result['passed']
          print('Member UI:', result['assertions'], 'assertions passed.')
          PY
      - name: Protected Matrix TXT download and replay controls
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/downloads-integration.php
      - name: Compact cards and member catalog
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp --skip-plugins=timonconfigs-core eval-file /tests/member-catalog-integration.php
      - name: Private-file format and ZNBK ZIP envelope validation
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/private-files-integration.php
      - name: Discord OAuth pilot and verification recovery
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/discord-integration.php
      - name: Discord login returns to the selected checkout safely
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/discord-checkout-return-integration.php
      - name: Owner draft persistence when private storage is missing
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/owner-editor-integration.php
      - name: Owner verification failure and recovery
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/owner-verification-integration.php
      - name: Windows GPC and TXT encodings and byte preservation
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/text-upload-integration.php
      - name: Shared Monthly and Lifetime config access
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/shared-vip-integration.php
      - name: Archive route cache upgrade
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/catalog-routes-integration.php
      - name: Published legal documents and legacy URL consolidation
        run: docker compose -f docker-compose.local.yml run --rm -v "$PWD/tests:/tests:ro" cli wp eval-file /tests/legal-publication-integration.php
      - name: Tear down disposable WordPress
        if: always()
        run: docker compose -f docker-compose.local.yml down -v --remove-orphans
