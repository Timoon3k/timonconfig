name: WordPress PHP lint
on:
  pull_request:
    paths:
      - 'wp-content/**/*.php'
      - 'tests/**/*.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP version
        run: php --version
      - name: Lint WordPress theme, plugin and PHP tests
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/timonconfigs wp-content/plugins/timonconfigs-core tests -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      - name: Discord checkout regression (no WordPress required)
        run: php tests/checkout-presentation-integration.php
      - name: Checkout captcha gate regression
        run: php tests/woo-captcha-integration.php
      - name: Discord role removal audit regression
        run: php tests/woo-discord-moderation-integration.php
      - name: Paid membership and Discord role lifecycle regression
        run: php tests/woo-role-lifecycle-integration.php
      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD
