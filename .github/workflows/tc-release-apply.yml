name: Apply TimonConfigs release to branch
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tc-release-apply.patch.gz.b64'
      - '.github/workflows/tc-release-apply.yml'
permissions:
  contents: write
jobs:
  apply-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply immutable release patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/tc-release-apply.patch.gz.b64
          test -f "$payload" || exit 0
          base64 -d "$payload" | gzip -dc > /tmp/tc-release.patch
          echo '8f1d2927618f1be304e0dc79e4290985daec61c8b85d0179e388bbb5de89f6f2  /tmp/tc-release.patch' | sha256sum --check --status
          git apply --check /tmp/tc-release.patch
          git apply /tmp/tc-release.patch
          git rm -q -- wp-content/plugins/timonconfigs-core/includes/class-tc-billing-discord.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing-paypal.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing-secrets.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing-store.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing-stripe.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing-ui.php wp-content/plugins/timonconfigs-core/includes/class-tc-billing.php
          git add -A -- wp-content/plugins/timonconfigs-core wp-content/themes/timonconfigs
          git rm -q -- .github/tc-release-apply.patch.gz.b64 .github/workflows/tc-release-apply.yml
          grep -q 'Version: 1.1.3' wp-content/plugins/timonconfigs-core/timonconfigs-core.php
          grep -q 'Version: 0.14.0' wp-content/themes/timonconfigs/style.css
          find wp-content/plugins/timonconfigs-core wp-content/themes/timonconfigs -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/tc-lint-results.txt
          git diff --cached --check
          git -c user.name='TimonConfigs Release Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Migrate TimonConfigs to WooCommerce ArraySubs checkout (Core 1.1.3, Theme 0.14.0)'
          git push origin HEAD:${{ github.head_ref }}
