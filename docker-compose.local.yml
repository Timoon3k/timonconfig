name: timonconfigs-local

services:
  db:
    image: mariadb:11.4
    container_name: timonconfigs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-wordpress
      MARIADB_ROOT_PASSWORD: local-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.3-php8.2-apache
    container_name: timonconfigs-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: "define('TIMONCONFIGS_PRIVATE_STORAGE_DIR', '/var/lib/timonconfigs-private');"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/timonconfigs:/var/www/html/wp-content/themes/timonconfigs
      - ./wp-content/plugins/timonconfigs-core:/var/www/html/wp-content/plugins/timonconfigs-core
      - private_data:/var/lib/timonconfigs-private

  cli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: "define('TIMONCONFIGS_PRIVATE_STORAGE_DIR', '/var/lib/timonconfigs-private');"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/timonconfigs:/var/www/html/wp-content/themes/timonconfigs
      - ./wp-content/plugins/timonconfigs-core:/var/www/html/wp-content/plugins/timonconfigs-core
      - private_data:/var/lib/timonconfigs-private

volumes:
  db_data:
    name: timonconfigs_db_data
  wp_data:
    name: timonconfigs_wp_data
  private_data:
    name: timonconfigs_private_data

